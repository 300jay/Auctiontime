{% extends "base.html" %}
{% block title %}Create Auction{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card">
      <div class="card-header"><h4 class="mb-0"><i class="bi bi-plus-circle"></i> Create New Auction</h4></div>
      <div class="card-body p-4">
        <form method="POST">
          <div class="mb-3">
            <label class="form-label fw-bold text-white">Auction Name</label>
            <input type="text" name="name" class="form-control" placeholder="e.g. IPL Mega Auction 2026" required />
          </div>
          <div class="mb-3">
            <label class="form-label fw-bold text-white">Budget Per Team (₹ Crores)</label>
            <div class="input-group">
              <span class="input-group-text bg-dark border-purple text-info">₹</span>
              <input type="number" name="budget_per_team" class="form-control" value="100" min="1" step="0.5" required />
              <span class="input-group-text bg-dark border-purple text-info">Cr</span>
            </div>
            <small class="text-muted">Standard IPL purse is ₹100.00 Cr per franchise.</small>
          </div>
          <div class="row g-3 mb-4">
            <div class="col-md-6">
              <label class="form-label fw-bold text-white">Min Squad Size</label>
              <input type="number" name="min_squad_size" class="form-control" value="15" min="1" max="50" required />
              <small class="text-muted">Purse reserved to meet min squad.</small>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-bold text-white">Max Squad Size (Cap)</label>
              <input type="number" name="max_squad_size" class="form-control" value="25" min="1" max="50" required />
              <small class="text-muted">Hard squad limit per team.</small>
            </div>
          </div>
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary flex-fill">Create Auction</button>
            <a href="{{ url_for('auctioneer_dashboard') }}" class="btn btn-outline-secondary flex-fill">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
